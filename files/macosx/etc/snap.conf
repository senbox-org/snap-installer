# ${HOME} will be replaced by user home directory according to platform
default_mac_userdir="${HOME}/.snap/system"

# Options used by the launcher by default,  can be overridden by explicit command line switches
# org.netbeans.JarClassLoader.limit_fd: max. number of JARs kept open. The NetBeans default (300) is below the
# number of JARs in SNAP, so JARs get closed and re-opened (re-reading their index) over and over at startup.
default_options="--branding snap --locale en_GB -J-Dorg.netbeans.JarClassLoader.limit_fd=2048 -J-Xverify:none -J-Xms256M -J-Xmx${installer:maxHeapSize} -J-Dnetbeans.mainclass=org.esa.snap.main.Main -J-Dsun.java2d.noddraw=true -J-Dsun.awt.nopixfmt=true -J-Dsun.java2d.dpiaware=false -J-Djava.security.manager=allow -J--add-opens=java.base/java.net=ALL-UNNAMED -J--add-opens=java.desktop/sun.awt=ALL-UNNAMED -J--add-opens=java.base/java.security=ALL-UNNAMED -J--add-opens=java.desktop/javax.swing=ALL-UNNAMED -J--add-opens=java.desktop/com.sun.imageio.plugins.jpeg=ALL-UNNAMED -J--add-opens=java.desktop/sun.java2d=ALL-UNNAMED -J--add-opens=java.desktop/com.sun.java.swing.plaf.windows=ALL-UNNAMED -J--add-opens=java.base/java.io=ALL-UNNAMED -J--add-opens=java.desktop/sun.awt.shell=ALL-UNNAMED"
# for development purposes you may wish to append: -J-Dnetbeans.logger.console=true -J-ea

# Default location of JRE
jdkhome="./.install4j/jre.bundle/Contents/Home/"

# Extra cluster paths separated by colon ':'
#extra_clusters=""
